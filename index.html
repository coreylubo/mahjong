<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <meta
      name="description"
      content="A beginner-first Hong Kong and Taiwanese mahjong reference, built for use live at the table."
    />

    <!--
      Add to Home Screen launches the app with no browser chrome at all.

      This matters more here than for most sites: the app is landscape-first
      and used at a table mid-hand, where Safari's address bar and tab strip
      eat the vertical space the reference columns need — and they reappear on
      every scroll. Installed, they are gone for good.

      `black-translucent` lets the app's own dark ground run under the status
      bar, which is why the viewport above sets `viewport-fit=cover`.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mahjong" />
    <title>Mahjong Reference</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
